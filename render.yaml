# Render blueprint for the TxnScreen API. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: txnscreen-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Comma-separated origins allowed to call the API, such as https://example.com,https://www.example.com.
      # Set in the Render dashboard, never committed.
      - key: ALLOWED_ORIGINS
        sync: false
